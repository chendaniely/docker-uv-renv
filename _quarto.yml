project:
  # otherwise README.md renders too
  render:
    - reports/*.qmd

format:
  html:
    embed-resources: true
    toc: true
  # PDF via Typst, which comes with Quarto
  typst:
    # png, not svg: R's svg figures need XQuartz on a Mac
    # not needed for local work, only CI
    fig-format: png
