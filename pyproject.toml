[project]
name = "docker-uv-renv"
version = "2026.11.13"
requires-python = ">=3.14"
dependencies = [
    "altair==6.3.0",
    "pandas==3.1.1",
    # Altair charts as images, for PDFs
    "vl-convert-python==1.9.0.post1",
    # Quarto needs these to run Python code
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "pyyaml==6.0.3",
]

[tool.uv]
# `uv add` writes an exact version (==)
add-bounds = "exact"
