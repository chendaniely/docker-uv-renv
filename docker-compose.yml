services:
  analysis-env:
    build: .
    image: docker-uv-renv
    ports:
      # 2222 on your computer, 22 in the container.
      # "127.0.0.1:2222:22" stops others on the same Wi-Fi from reaching it.
      - "2222:22"
    volumes:
      - .:/workspace
      # ro: read-only
      - ~/.ssh/id_ed25519.pub:/root/.ssh/authorized_keys:ro
